name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

- name: Build APK
  run: |
    docker run --rm \
      -u 1000:1000 \
      -v ${{ github.workspace }}:/home/user/app \
      -w /home/user/app \
      kivy/buildozer \
      buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
